<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit and remove DOM Element</title>
</head>

<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    //    function addLanguage(languageName) {
    //     const li = document.createElement('li');
    //     li.innerHTML = `${languageName}`;
    //     document.querySelector('.language').appendChild(li);
    //    }
    //    addLanguage("Python");

    const addLanguage = (languageName) => {
        const li = document.createElement('li');
        li.innerHTML = `${languageName}`;
        document.querySelector('.language').appendChild(li);
    };

    addLanguage("Python");
    addLanguage("TypeScript");

    const addOptimisedLanguage = (languageName) => {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(languageName));
        document.querySelector('.language').appendChild(li);
    }
    addOptimisedLanguage('golang'); 

    // Edit
    const secondLanguage = document.querySelector("li:nth-child(2)");
    // secondLanguage.innerHTML = "ReactJS";
    // Optimized approch
    const newli = document.createElement('li');
    newli.textContent = "ReactJS";
    secondLanguage.replaceWith(newli);


    // // Edit
    //  const firstLanguage = document.querySelector('li:nth-child(1)');
    //  const newli2 = document.createElement('li');
    //  newli2.textContent = "C++";
    //  firstLanguage.replaceWith(newli2);

    // or Edit(second Method)
    const firstLanguage = document.querySelector('li:first-child');
    firstLanguage.outerHTML = "<li>C#</li>";

    // remove 
    const lastLanguage = document.querySelector('li:last-child');
    lastLanguage.remove();


</script>

</html>
